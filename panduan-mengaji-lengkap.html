<title>Panduan Mengaji – Majlis Al-Muntaha</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F7F1;--surface:#fff;--ink:#1d2a24;--muted:#4A6B5D;--primary:#0C5A3E;--on-primary:#fff;--gold:#C29B38;--line:#e2ddcc;--soft:#eef3ee;--ar:26px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--surface:#18231d;--ink:#e8efe9;--muted:#9bb5a8;--primary:#55DBA2;--on-primary:#0F1713;--line:#2a3a31;--soft:#1f2e26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1713;--surface:#18231d;--ink:#e8efe9;--muted:#9bb5a8;--primary:#55DBA2;--on-primary:#0F1713;--line:#2a3a31;--soft:#1f2e26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-family:Amiri,serif;font-size:2rem;margin:8px 0 0;color:var(--primary)}
h2{margin:0;font-size:1.1rem}
.sub{color:var(--muted);margin:0 0 14px}
input[type=search],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.last{display:block;width:100%;text-align:left;border-color:var(--gold);margin:12px 0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cat{text-align:left;padding:14px;border-radius:12px;min-height:96px}
.cat b{display:block}.cat small{color:var(--muted)}.cat .a{font-family:Amiri,serif;font-size:1.25rem;color:var(--primary);display:block;direction:rtl;text-align:right}
.cat.tb{border-color:var(--gold)}
.item{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px}.item small{display:block;color:var(--muted)}
.intro{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card.flash{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chead{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.chead b{flex:1}
.rep{background:var(--gold);color:#1d2a24;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.bm{padding:4px 10px;font-size:.85rem}.bm.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.ar{font-family:Amiri,serif;direction:rtl;text-align:right;line-height:2.1;font-size:var(--ar);margin:6px 0;white-space:pre-wrap}
.lat{font-style:italic;color:var(--muted);margin:6px 0;white-space:pre-wrap}
.idn{margin:6px 0;white-space:pre-wrap}
.note{border-left:3px solid var(--gold);padding-left:10px;color:var(--muted);margin-top:8px;font-size:.92rem}
.who{font-weight:700;color:var(--primary);margin:10px 0 0}
.resp{border-top:1px dashed var(--line);margin-top:10px;padding-top:4px}
.sec{font-weight:700;margin:18px 0 8px;color:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel label{display:flex;align-items:center;gap:8px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.on{background:var(--gold);color:#1d2a24;border-color:var(--gold);font-weight:700}
.count{font:700 5.5rem/1 "Plus Jakarta Sans",sans-serif;text-align:center;color:var(--primary);margin:14px 0 4px}.count small{font-size:1.4rem;color:var(--muted)}
.zk{font-family:Amiri,serif;font-size:2rem;text-align:center;margin:4px 0}
.tbtn{display:block;width:100%;padding:44px 0;font-size:1.4rem;font-weight:700;border-radius:20px;background:var(--primary);color:var(--on-primary);border:0;touch-action:manipulation}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin:4px 0}textarea{min-height:110px}.fl{font-weight:600;margin-top:12px;display:block}input[type=number]{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;width:110px}input[type=file]{margin:4px 0;max-width:100%}.del{margin-top:8px;font-size:.85rem}
</style>

<script>
var D={"istighosah": {"meta": {}, "items": [{"id": 1, "title": "Istighfar", "arabic": "أَسْتَغْفِرُ اللهَ", "latin": "Astaghfirullaah", "translation": "Aku memohon ampun kepada Allah", "repeatCount": 100}, {"id": 2, "title": "Istighfar lil Mukminin", "arabic": "أَسْتَغْفِرُ اللهَ لِي وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ", "latin": "Astaghfirullaaha lii wa lil mu'miniina wal mu'minaat", "translation": "Aku memohon ampun kepada Allah untuk diriku dan untuk orang-orang mukmin laki-laki serta wanita", "repeatCount": 1}, {"id": 3, "title": "Al-Fatihah", "arabic": "الْفَاتِحَةُ\n(إِلَى حَضْرَةِ جَمِيعِ الْمَشَايِخِ إِلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ)", "latin": "Al-Faatihah (Ilaa hadhrati jamii'il masyaayikh ilaa Rasuulillaah SAW)", "translation": "Membaca surat Al-Fatihah dihadiahkan untuk segenap para guru dan masyaikh hingga Baginda Rasulullah SAW", "repeatCount": 1, "note": "Surat Al-Fatihah dihadiahkan kepada para guru dan Rasulullah SAW"}, {"id": 4, "title": "Sholawat Nariyah", "arabic": "صَلَوَاتُ النَّارِيَّةِ\n\nاللَّهُمَّ صَلِّ صَلَاةً كَامِلَةً وَسَلِّمْ سَلَامًا تَامًّا عَلَى سَيِّدِنَا مُحَمَّدٍ الَّذِي تَنْحَلُّ بِهِ الْعُقَدُ وَتَنْفَرِجُ بِهِ الْكُرَبُ وَتُقْضَى بِهِ الْحَوَائِجُ وَتُنَالُ بِهِ الرَّغَائِبُ وَحُسْنُ الْخَوَاتِيمِ وَيُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ الْكَرِيمِ وَعَلَى آلِهِ وَصَحْبِهِ فِي كُلِّ لَمْحَةٍ وَنَفَسٍ بِعَدَدِ كُلِّ مَعْلُومٍ لَكَ", "latin": "Allaahumma sholli sholaatan kaamilatan wa sallim salaaman taamman 'alaa sayyidinaa Muhammadinil ladzii tanhallu bihil 'uqodu wa tanfariju bihil kurobu wa tuqdhoo bihil hawaa-iju wa tunaalu bihir-roghoo-ibu wa husnul khowaatiimi wa yustasqal ghomaamu bi wajhihil kariimi wa 'alaa aalihii wa shohbihii fii kulli lamhatin wa nafasin bi 'adadi kulli ma'luumin lak", "translation": "Ya Allah, limpahkanlah shalawat yang sempurna dan keselamatan yang menyeluruh kepada junjungan kami Nabi Muhammad, yang dengan perantaranya terurai segala ikatan, lenyap segala kesulitan, terpenuhi segala hajat, diraih segala harapan dan akhir hidup yang baik, serta dimohonkan turunnya hujan lewat wajahnya yang mulia, dan limpahkanlah pula kepada keluarga serta para sahabatnya dalam setiap kedipan mata dan hembusan nafas sebanyak ilmu yang Engkau ketahui.", "repeatCount": 1}, {"id": 5, "title": "Ya Hayyu Ya Qoyyum", "arabic": "يَا حَيُّ يَا قَيُّوْمُ", "latin": "Yaa Hayyu Yaa Qayyuum", "translation": "Wahai Dzat Yang Maha Hidup, wahai Dzat Yang Maha Berdiri Sendiri", "repeatCount": 33}, {"id": 6, "title": "Ya Kaafi Ya Ghaniyy", "arabic": "يَا كَافِي يَا غَنِيُّ يَا فَتَّاحُ يَا رَزَّاقُ", "latin": "Yaa Kaafii Yaa Ghaniyyu Yaa Fattaahu Yaa Razzaaq", "translation": "Wahai Dzat Yang Maha Mencukupi, Maha Kaya, Maha Pembuka Rahmat, Maha Pemberi Rezeki", "repeatCount": 3}, {"id": 7, "title": "Ya Habibi Ya Rohman", "arabic": "يَا حَبِيبِي يَا رَحْمَنُ يَا وَهَّابُ يَا أَللهُ", "latin": "Yaa Habiibii Yaa Rahmaanu Yaa Wahhaabu Yaa Allaah", "translation": "Wahai Kekasihku, wahai Dzat Yang Maha Pengasih, Maha Pemberi Kurnia, wahai Allah", "repeatCount": 3}, {"id": 8, "title": "Ya Allah...", "arabic": "يَا أَللهُ . . .", "latin": "Yaa Allaah . . .", "translation": "Wahai Allah . . .", "repeatCount": 3}, {"id": 9, "title": "Ya Rohman Ya Rohim", "arabic": "يَا رَحْمَنُ يَا رَحِيمُ", "latin": "Yaa Rahmaanu Yaa Rahiim", "translation": "Wahai Dzat Yang Maha Pengasih, wahai Dzat Yang Maha Penyayang", "repeatCount": 3}, {"id": 10, "title": "Ya Hannan Ya Mannan", "arabic": "يَا حَنَّانُ يَا مَنَّانُ", "latin": "Yaa Hannaanu Yaa Mannaan", "translation": "Wahai Dzat Yang Maha Santun dan Berbelas Kasih, Maha Pemberi Anugerah", "repeatCount": 3}, {"id": 11, "title": "Ya Lathif...", "arabic": "يَا لَطِيفُ . . .", "latin": "Yaa Lathiif . . .", "translation": "Wahai Dzat Yang Maha Lembut", "repeatCount": 7}, {"id": 12, "title": "Ya Aziz...", "arabic": "يَا عَزِيزُ . . .", "latin": "Yaa 'Aziiz . . .", "translation": "Wahai Dzat Yang Maha Perkasa", "repeatCount": 7}, {"id": 13, "title": "Ya Qowiyyu Ya Aziz", "arabic": "يَا قَوِيُّ يَا عَزِيزُ يَا عَلِيمُ يَا قَدِيرُ يَا سَمِيعُ يَا بَصِيرُ", "latin": "Yaa Qawiyyu Yaa 'Aziizu Yaa 'Aliimu Yaa Qadiiru Yaa Samii'u Yaa Bashiir", "translation": "Wahai Dzat Yang Maha Kuat, Maha Perkasa, Maha Mengetahui, Maha Kuasa, Maha Mendengar, Maha Melihat", "repeatCount": 3}, {"id": 14, "title": "Ya Aliyyu Ya Azhim", "arabic": "يَا عَلِيُّ يَا عَظِيمُ يَا حَلِيمُ يَا عَلِيمُ", "latin": "Yaa 'Aliyyu Yaa 'Azhiimu Yaa Haliimu Yaa 'Aliim", "translation": "Wahai Dzat Yang Maha Tinggi, Maha Agung, Maha Penyantun, Maha Mengetahui", "repeatCount": 3}, {"id": 15, "title": "Doa Hari Perhimpunan (Ali 'Imran: 9)", "arabic": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "latin": "Rabbanaa innaka jaami'un-naasi li yawmil laa rayba fiih, innallaaha laa yukhliful mii'aad", "translation": "Ya Tuhan kami, sesungguhnya Engkau mengumpulkan manusia untuk (menerima pembalasan pada) hari yang tak ada keraguan padanya. Sesungguhnya Allah tidak menyalahi janji.", "repeatCount": 1}, {"id": 16, "title": "Seruan Ibadah Haji (Al-Hajj: 27)", "arabic": "وَأَذِّنْ فِي النَّاسِ بِالْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَى كُلِّ ضَامِرٍ يَأْتِينَ مِنْ كُلِّ فَجٍّ عَمِيقٍ", "latin": "Wa adzdzin fin-naasi bil hajji ya'tuuka rijaalan wa 'alaa kulli dhaamirin ya'tiina min kulli fajjin 'amiiq", "translation": "Dan berserulah kepada manusia untuk mengerjakan haji, niscaya mereka akan datang kepadamu dengan berjalan kaki, dan mengendarai unta yang kurus yang datang dari segenap penjuru yang jauh.", "repeatCount": 1}, {"id": 17, "title": "Surat Nabi Sulaiman (An-Naml: 30-31)", "arabic": "إِنَّهُ مِنْ سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ . أَلَّا تَعْلُوا عَلَيَّ وَأْتُونِي مُسْلِمِينَ", "latin": "Innahuu min Sulaymaana wa innahuu bismillaahir-rahmaanir-rahiim, allaa ta'luu 'alayya wa'tuunii muslimiin", "translation": "Sesungguhnya surat itu dari Sulaiman dan sesungguhnya isinya: 'Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang. Janganlah kamu sekalian berlaku sombong terhadapku dan datanglah kepadaku sebagai orang-orang yang berserah diri.'", "repeatCount": 1}, {"id": 18, "title": "Kasih Sayang Allah (Thaha: 39)", "arabic": "وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِنِّي وَلِتُصْنَعَ عَلَى عَيْنِي", "latin": "Wa alqaytu 'alayka mahabbatan minnii wa litushna'a 'alaa 'aynii", "translation": "Dan Aku telah melimpahkan kepadamu kasih sayang yang datang dari-Ku; dan supaya kamu diasuh di bawah pengawasan-Ku.", "repeatCount": 3}, {"id": 19, "title": "Perintah Sabar & Berjaga (Ali 'Imran: 200)", "arabic": "يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ", "latin": "Yaa ayyuhalladziina aamanush-biruu wa shaabiruu wa raabithuu wat-taqullaaha la'allakum tuflihuun", "translation": "Hai orang-orang yang beriman, bersabarlah kamu dan kuatkanlah kesabaranmu dan tetaplah bersiap siaga dan bertakwalah kepada Allah, supaya kamu beruntung.", "repeatCount": 1}, {"id": 20, "title": "Kekuasaan Siang & Malam (Al-An'am: 13)", "arabic": "وَلَهُ مَا سَكَنَ فِي اللَّيْلِ وَالنَّهَارِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "latin": "Wa lahuu maa sakana fil-layli wan-nahaari wa huwas-samii'ul 'aliim", "translation": "Dan kepunyaan Allah-lah segala apa yang ada pada malam dan siang hari. Dan Dialah Yang Maha Mendengar lagi Maha Mengetahui.", "repeatCount": 1}, {"id": 21, "title": "Bumi Diwarisi Hamba Saleh (Al-Anbiya: 105)", "arabic": "وَلَقَدْ كَتَبْنَا فِي الزَّبُورِ مِنْ بَعْدِ الذِّكْرِ أَنَّ الْأَرْضَ يَرِثُهَا عِبَادِيَ الصَّالِحُونَ", "latin": "Wa laqad katabnaa fiz-zabuuri mim ba'didz-dzikri annal ardha yaritsuhaa 'ibaadiyash-shaalihuun", "translation": "Dan sungguh telah Kami tulis di dalam Zabur sesudah (Kami tulis dalam) Lauh Mahfuzh, bahwasanya bumi ini dipusakai hamba-hamba-Ku yang saleh.", "repeatCount": 1}, {"id": 22, "title": "Kisah Menghidupkan Kembali (Al-Baqarah: 259)", "arabic": "أَوْ كَالَّذِي مَرَّ عَلَى قَرْيَةٍ وَهِيَ خَاوِيَةٌ عَلَى عُرُوشِهَا قَالَ أَنَّى يُحْيِي هَذِهِ اللَّهُ بَعْدَ مَوْتِهَا فَأَمَاتَهُ اللَّهُ مِائَةَ عَامٍ ثُمَّ بَعَثَهُ قَالَ كَمْ لَبِثْتَ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ قَالَ بَلْ لَبِثْتَ مِائَةَ عَامٍ فَانْظُرْ إِلَى طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ وَانْظُرْ إِلَى حِمَارِكَ وَلِنَجْعَلَكَ آيَةً لِلنَّاسِ وَانْظُرْ إِلَى الْعِظَامِ كَيْفَ نُنْشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا فَلَمَّا تَبَيَّنَ لَهُ قَالَ أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Aw kalladzii marra 'alaa qaryatin wa hiya khaawiyatun 'alaa 'uruusyihaa qaala annaa yuhyii haadzihillaahu ba'da mawtihaa, fa-amaatahullaahu mi-ata 'aamin tsumma ba'atsahu, qaala kam labitsta, qaala labitstu yawman aw ba'dho yawm, qaala bal labitsta mi-ata 'aamin fanzhur ilaa tho'aamika wa syaraabika lam yatasannah, wanzhur ilaa himaarika wa linaj'alaka aayatan lin-naas, wanzhur ilal 'izhaami kayfa nunsyizuhaa tsumma naksuuhaa lahmaa, falammaa tabayyana lahuu qaala a'lamu annallaaha 'alaa kulli syay-in qadiir", "translation": "Atau apakah (kamu tidak memperhatikan) orang yang melalui suatu negeri yang (temboknya) roboh menutupi atapnya? Dia berkata: 'Bagaimanakah Allah menghidupkan kembali negeri ini setelah runtuh?' Maka Allah mematikannya selama seratus tahun, kemudian membangkitkannya kembali... Tatkala telah nyata baginya, dia berkata: 'Aku mengetahui bahwa Allah Maha Kuasa atas segala sesuatu.'", "repeatCount": 1}, {"id": 23, "title": "Doa Keluarga Sakinah (Al-Furqan: 74)", "arabic": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "latin": "Rabbanaa hab lanaa min azwaajinaa wa dzurriyyatinaa qurrata a'yunin waj'alnaa lil muttaqiina imaamaa", "translation": "Ya Tuhan kami, anugrahkanlah kepada kami isteri-isteri kami dan keturunan kami sebagai penyenang hati (kami), dan jadikanlah kami imam bagi orang-orang yang bertakwa.", "repeatCount": 3}, {"id": 24, "title": "Doa Nabi Nuh (Al-Qamar: 10)", "arabic": "رَبِّ إِنِّي مَغْلُوبٌ فَانْتَصِرْ", "latin": "Rabbi innii maghluubun fantashir", "translation": "Ya Tuhanku, sesungguhnya aku ini (adalah orang) yang dikalahkan, oleh sebab itu tolonglah (aku).", "repeatCount": 3}, {"id": 25, "title": "Huruf Muqatta'ah Kaf Ha Ya 'Ain Shod", "arabic": "كٓهيعٓصٓ كِفَايَتُنَا", "latin": "Kaaf Haa Yaa 'Aiin Shaad - Kifaayatunaa", "translation": "Kaaf Haa Yaa 'Aiin Shaad menjadi pencukup bagi kami", "repeatCount": 1}, {"id": 26, "title": "Huruf Muqatta'ah Ha Mim 'Ain Sin Qof", "arabic": "حـم عسق حِمَايَتُنَا", "latin": "Haa Miim, 'Aiin Siin Qaaf - Himaayatunaa", "translation": "Haa Miim, 'Aiin Siin Qaaf menjadi pelindung bagi kami", "repeatCount": 1}, {"id": 27, "title": "Qaf wal Qur'anil Majid", "arabic": "ق وَالْقُرْآنِ الْمَجِيدِ وِقَايَتُنَا", "latin": "Qaaf wal qur'aanil majiid - Wiqaayatunaa", "translation": "Qaaf, demi Al-Qur'an yang sangat mulia menjadi perisai bagi kami", "repeatCount": 1}, {"id": 28, "title": "Yasin Syifa'una", "arabic": "يس شِفَائُنَا", "latin": "Yaa Siin Syifaa-unaa", "translation": "Yaa Siin menjadi penawar dan obat kesembuhan bagi kami", "repeatCount": 7}, {"id": 29, "title": "Ha Mim Qadha'u Hawa'ijina", "arabic": "حـم قَضَاءُ حَوَائِجِنَا", "latin": "Haa Miim Qadhaa-u Hawaa-ijinaa", "translation": "Haa Miim pemenuh segala hajat dan kebutuhan kami", "repeatCount": 7}, {"id": 30, "title": "Pasrah Kepada Allah (Ghafir: 44)", "arabic": "وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ", "latin": "Wa ufawwidhu amrii ilallaah, innallaaha bashiirum bil 'ibaad", "translation": "Dan aku menyerahkan urusanku kepada Allah. Sesungguhnya Allah Maha Melihat akan hamba-hamba-Nya.", "repeatCount": 3}, {"id": 31, "title": "Hasbunallah (Ali 'Imran: 173)", "arabic": "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", "latin": "Hasbunallaahu wa ni'mal wakiil", "translation": "Cukuplah Allah menjadi Penolong kami dan Allah adalah sebaik-baik Pelindung.", "repeatCount": 7}, {"id": 32, "title": "Tipu Daya Dihancurkan (An-Naml: 50-51)", "arabic": "وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ * فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَاهُمْ وَقَوْمَهُمْ أَجْمَعِينَ", "latin": "Wa makaruu makran wa makarnaa makran wa hum laa yasy'uruun, fanzhur kayfa kaana 'aaqibatu makrihim annaa dammarnaahum wa qawmahum ajma'iin", "translation": "Dan merekapun merencanakan makar dengan sungguh-sungguh dan Kami merencanakan makar (pula), sedang mereka tidak menyadari. Maka perhatikanlah betapa sesungguhnya akibat makar mereka itu, bahwasanya Kami membinasakan mereka dan kaum mereka semuanya.", "repeatCount": 1}, {"id": 33, "title": "Tauhid Murni", "arabic": "اَللهُ اللهُ رَبِّيْ لَا أُشْرِكُ بِهِ شَيْئًا", "latin": "Allaahu Allaahu Rabbii laa usyriku bihii syay-aa", "translation": "Allah, Allah adalah Tuhanku, aku tidak menyekutukan-Nya dengan sesuatu apapun.", "repeatCount": 3}, {"id": 34, "title": "Doa Nabi Yunus (Al-Anbiya: 87)", "arabic": "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "latin": "Laa ilaaha illaa anta subhaanaka innii kuntu minadh-dhaalimiin", "translation": "Tidak ada Tuhan selain Engkau. Maha Suci Engkau, sesungguhnya aku adalah termasuk orang-orang yang zalim.", "repeatCount": 33}, {"id": 35, "title": "Tasbih Kalimat Cinta Allah", "arabic": "سُبْحَانَ اللهِ وَبِحَمْدِهِ سُبْحَانَ اللهِ الْعَظِيمِ", "latin": "Subhaanallaahi wa bihamdihii subhaanallaahil 'azhiim", "translation": "Maha Suci Allah dengan memuji-Nya, Maha Suci Allah Dzat Yang Maha Agung.", "repeatCount": 33}, {"id": 36, "title": "Tahlil", "arabic": "لَا إِلَهَ إِلَّا اللهُ", "latin": "Laa ilaaha illallaah", "translation": "Tiada Tuhan selain Allah", "repeatCount": 100}, {"id": 37, "title": "Doa Munajat", "arabic": "اَلدُّعَاءُ\n\nاللَّهُمَّ يَا قَاضِيَ الْحَاجَاتِ، وَيَا مُجِيبَ الدَّعَوَاتِ، اسْتَجِبْ دُعَاءَنَا، وَاقْضِ حَوَائِجَنَا، وَفَرِّجْ هُمُومَنَا، وَاشْفِ مَرْضَانَا، وَارْحَمْ مَوْتَانَا، وَاغْفِرْ لَنَا وَلِوَالِدَيْنَا وَلِجَمِيعِ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.", "latin": "Ad-Du'aa:\nAllaahumma yaa qaadhiyal haajaat, wa yaa mujiibad da'awaat, istajib du'aa-anaa, waqdhi hawaa-ijanaa, wa farrij humuumanaa, wasyfi mardhaanaa, warham mawtaanaa, waghfir lanaa wa liwaalidaynaa wa li jamii'il muslimiina wal muslimaat, bi rahmatika yaa arhamar raahimiin.", "translation": "Doa Penutup: Ya Allah, wahai Dzat Pemenuh segala kebutuhan, Pengabul segala doa, kabulkanlah doa kami, penuhilah segala hajat kami, lapangkanlah duka kami, sembuhkanlah yang sakit di antara kami, sayangilah yang telah wafat, dan ampunilah kami, kedua orang tua kami, dan seluruh kaum muslimin dan muslimat, dengan rahmat-Mu wahai Dzat Yang Maha Penyayang.", "repeatCount": 1}, {"id": 38, "title": "Qasidah Burdah (Sholawat)", "arabic": "مَوْلَايَ صَلِّ وَسَلِّمْ دَائِمًا أَبَدًا\nعَلَى حَبِيبِكَ خَيْرِ الْخَلْقِ كُلِّهِمِ\n\nهُوَ الْحَبِيبُ الَّذِي تُرْجَى شَفَاعَتُهُ\nلِكُلِّ هَوْلٍ مِنَ الْأَهْوَالِ مُقْتَحَمِ", "latin": "Mawlaaya shalli wa sallim daa-iman abadaa\n'Alaa habiibika khayril khalqi kullihimi\n\nHuwal habiibul ladzii turjaa syafaa'atuhuu\nLi kulli hawlin minal ahwaali muqtahami", "translation": "Wahai Tuhanku, limpahkanlah selalu shalawat dan salam selamanya kepada Kekasih-Mu sebaik-baik seluruh makhluk. Dialah sang Kekasih yang diharapkan syafaatnya dalam menghadapi setiap ketakutan dari huru-hara yang mencekam.", "repeatCount": 1}, {"id": 39, "title": "Ya Rabbi Bil Musthafa", "arabic": "يَا رَبِّ بِالْمُصْطَفَى بَلِّغْ مَقَاصِدَنَا\nوَاغْفِرْ لَنَا مَا مَضَى يَا وَاسِعَ الْكَرَمِ", "latin": "Yaa Rabbi bil Mushthafaa balligh maqaashidanaa\nWaghfir lanaa maa madhaa yaa waasi'al karami", "translation": "Wahai Tuhanku, demi kemuliaan Al-Musthafa (Nabi Muhammad SAW) sampaikanlah segala maksud dan tujuan kami, dan ampunilah dosa-dosa kami yang telah lalu, wahai Dzat Yang Maha Luas Kemurahan-Nya.", "repeatCount": 3}, {"id": 40, "title": "Ya Arhamar Rahimin Farrij", "arabic": "يَا أَرْحَمَ الرَّاحِمِينَ\nفَرِّجْ عَلَى الْمُسْلِمِينَ", "latin": "Yaa Arhamar Raahimiin (3x)\nFarrij 'alal muslimiin", "translation": "Wahai Dzat Yang Maha Penyayang di antara para penyayang (3x), berilah kelapangan dan jalan keluar bagi kaum muslimin.", "repeatCount": 3}]}, "mahlul": {"meta": {"title": "Mahlul Qiyam (محل القيام)", "subtitle": "Bait Sholawat Berdiri & Thola'al Badru 'Alaina", "introNote": "Dibaca dengan berdiri penuh takzim dan mahabbah saat memperingati maulid Baginda Rasulullah SAW."}, "items": [{"id": 1, "title": "Salam Pembuka", "arabic": "يَا نَبِي سَلَامْ عَلَيْكَ * يَا رَسُوْل سَلَامْ عَلَيْكَ\nيَا حَبِيبْ سَلَامْ عَلَيْكَ * صَلَوَاتُ اللهِ عَلَيْكَ", "latin": "Yaa Nabii salaam 'alayka * Yaa Rasuul salaam 'alayka\nYaa Habiib salaam 'alayka * Sholawaatullaahi 'alayka", "translation": "Wahai Nabi, salam sejahtera atasmu. Wahai Rasul, salam sejahtera atasmu. Wahai Kekasih, salam sejahtera atasmu. Shalawat Allah tercurah atasmu.", "repeatCount": 1}, {"id": 2, "title": "Kelahiran Cahaya Agung", "arabic": "أَشْرَقَ الْكَوْنُ ابْتِهَاجًا * بِوُجُوْدِ الْمُصْطَفَى أَحْمَدْ\nوَلِأَهْلِ الْكَوْنِ أُنْسٌ * وَسُرُوْرٌ قَدْ تَجَدَّدْ", "latin": "Asyraqal kawnu ibtihaajan * Biwujuudil Mushthafaa Ahmad\nWa li-ahlil kawni unsun * Wa suruurun qad tajaddad", "translation": "Alam semesta berseri-seri penuh kegembiraan dengan hadirnya insan terpilih Nabi Ahmad (Muhammad SAW). Dan segenap penghuni alam merasakan kedamaian serta kegembiraan yang selalu terbarukan.", "repeatCount": 1}, {"id": 3, "title": "Gemuruh Nyanyian Keberkahan", "arabic": "فَاطْرَبُوْا يَاأَهْلَ الْمَثَانِي * فَهَزَارُ الْيُمْنِ غَرَّدْ\nوَاسْتَضِيْئُوْا بِجَمَالٍ * فَاقَ فِي الْحُسْنِ تَفَرَّدْ", "latin": "Faathrabuu yaa ahlal matsaanii * Fahazaorul yumni gharrad\nWas-tadhii-uu bi jamaalin * Faaqo fiil husni tafarrad", "translation": "Maka bergembiralah wahai para pembaca dzikir, burung-burung kenikmatan berkicau riang. Dan ambillah cahaya dari keelokan yang tiada tandingannya dalam keindahan.", "repeatCount": 1}, {"id": 4, "title": "Kabar Gembira Abadi", "arabic": "وَلَنَا الْبُشْرَى بِسَعْدٍ * مُسْتَمِرٍّ لَيْسَ يَنْفَدْ\nحَيْثُ أُوْتِيْنَا عَطَاءً * جَمَعَ الْفَخْرَ الْمُؤَبَّدْ", "latin": "Wa lanal busyraa bi sa'din * Mustamirin laysa yanfad\nHaytsu uutiinaa 'athaa-an * Jama'al fakhral mu'abbad", "translation": "Dan bagi kita kabar gembira dengan kebahagiaan abadi yang tiada pernah habis. Ketika kita dianugerahi pemberian yang menghimpun segala kemuliaan abadi.", "repeatCount": 1}, {"id": 5, "title": "Marhaban Ya Nurul 'Aini", "arabic": "مَرْحَبًا فَلِرَبِّي كُلُّ حَمْدٍ * مَرْحَبًا جَلَّ أَنْ يَحْصُرَهُ الْعَدْ\nمَرْحَبًا مَرْحَبًا يَا نُوْرَ الْعَيْنِ * مَرْحَبًا مَرْحَبًا جَدَّ الْحُسَيْنِ\nإِذْ حَبَانَا بِوُجُوْدِ الـ * مُصْطَفَى الْهَادِي مُحَمَّدْ\nمَرْحَبًا يَا نُوْرَ الْعَيْنِ مَرْحَبًا مَرْحَبًا * مَرْحَبًا جَدَّ الْحُسَيْنِ مَرْحَبًا مَرْحَبًا", "latin": "Marhaban falirabbii kullu hamdin * Marhaban jalla an yahshurahul 'ad\nMarhaban marhaban yaa nuural 'ayni * Marhaban marhaban jaddal Husayni\nIdz habaanaa bi wujuudil * Mushthafal haadii Muhammad\nMarhaban yaa nuural 'ayni marhaban marhaban * Marhaban jaddal Husayni marhaban marhaban", "translation": "Selamat datang, segala puji bagi Tuhanku yang teramat agung untuk dapat dihitung. Selamat datang wahai cahaya mataku, selamat datang wahai kakek dari Sayyidina Husain, karena Dia telah menganugerahkan kehadiran Al-Musthafa penunjuk jalan kebenaran Nabi Muhammad.", "repeatCount": 1}, {"id": 6, "title": "Permohonan Lewat Keagungan Nabi", "arabic": "يَا رَسُوْلَ اللهِ أَهْلًا * بِكَ إِنَّا بِكَ نُسْعَدْ\nوَبِجَاهِهِ يَا إِلَهِي * جُدْ وَبَلِّغْ كُلَّ مَقْصَدْ\nوَاهْدِنَا نَهْجَ سَبِيْلِهِ * كَيْ بِهِ نُسْعَدْ وَنُرْشَدْ\nرَبِّ بَلِّغْنَا بِجَاهِهِ * فِي جِوَارِهِ خَيْرَ مَقْعَدْ", "latin": "Yaa Rasuulallaahi ahlan * Bika innaa bika nus'ad\nWa bi jaahihii yaa Ilaahii * Jud wa balligh kulla maqshad\nWahdinaa nahja sabiilihii * Kay bihii nus'ad wa nursyad\nRabbi ballighnaa bi jaahihii * Fii jiwaarihii khayra maq'ad", "translation": "Wahai Rasulullah selamat datang, sungguh bersama engkau kami berbahagia. Dan dengan pangkat kemuliaannya ya Allah, limpahkan karunia dan sampaikanlah setiap maksud kami. Tunjukilah kami jalan lintasannya agar kami berbahagia dan beroleh petunjuk. Ya Rabbi tempatkanlah kami berkat kedudukannya di sisinya dalam sebaik-baik tempat peristirahatan.", "repeatCount": 1}, {"id": 7, "title": "Shalawat dan Salam Senantiasa", "arabic": "وَصَلَاةُ اللهِ تَغْشَى * أَشْرَفَ الرُّسْلِ مُحَمَّدْ\nوَسَلَامٌ مُسْتَمِرٌّ * كُلَّ حِينٍ يَتَجَدَّدْ\nصَلَّى اللهُ عَلَى مُحَمَّدْ مَرْحَبًا * صَلَّى اللهُ عَلَيْهِ وَسَلَّمْ مَرْحَبًا\nصَلَّى اللهُ عَلَى مُحَمَّدْ مَرْحَبًا * صَلَّى اللهُ عَلَيْهِ وَسَلَّمْ مَرْحَبًا", "latin": "Wa shalaatullaahi taghsyaa * Asyrafar rusli Muhammad\nWa salaamun mustamirrun * Kulla hiinin yatajaddad\nShollallaahu 'alaa Muhammad marhaban * Shollallaahu 'alayhi wa sallam marhaban\nShollallaahu 'alaa Muhammad marhaban * Shollallaahu 'alayhi wa sallam marhaban", "translation": "Dan shalawat Allah senantiasa meliputi semulia-mulia para utusan yakni Nabi Muhammad. Serta salam yang berkesinambungan senantiasa terbarui setiap saat. Semoga Allah melimpahkan shalawat kepada Nabi Muhammad, selamat datang! Semoga shalawat dan salam tercurah padanya.", "repeatCount": 1}, {"id": 8, "title": "Doa Khusnul Khatimah & Pengampunan", "arabic": "رَبِّ فَاجْعَلْ مُجْتَمَعْنَا يَا اللهْ * غَايَةً حُسْنَ الْخِتَامِ يَا اللهْ\nرَبِّ فَارْحَمْنَا جَمِيعًا يَا اللهْ * بِجَمِيعِ الصَّالِحَاتِ يَا اللهْ\nرَبِّ فَاغْفِرْ لِي ذُنُوبِي يَا اللهْ * بِبَرَكَةِ الْهَادِي مُحَمَّدْ يَا اللهْ\nرَبِّ فَاغْفِرْ لِي ذُنُوبِي يَا اللهْ * بِبَرَكَةِ الْهَادِي مُحَمَّدْ يَا اللهْ", "latin": "Rabbi faj'al mujtama'naa yaa Allaah * Ghaayatan husnal khitaam yaa Allaah\nRabbi farhamnaa jamii'aa yaa Allaah * Bi jamii'ish shaalihaat yaa Allaah\nRabbi faghfir lii dzunuubii yaa Allaah * Bi barakatil haadii Muhammad yaa Allaah\nRabbi faghfir lii dzunuubii yaa Allaah * Bi barakatil haadii Muhammad yaa Allaah", "translation": "Ya Rabbi jadikanlah perkumpulan majelis kami ini berujung akhir yang baik (husnul khatimah). Ya Rabbi kasihilah kami sekalian dengan segala amal kebajikan. Ya Rabbi ampunilah dosa-dosaku dengan berkah petunjuk Nabi Muhammad.", "repeatCount": 1}, {"id": 9, "title": "Thola'al Badru 'Alaina", "arabic": "طَلَعَ الْبَدْرُ عَلَيْنَا * مِنْ ثَنِيَّةِ الْوَدَاعِ\nوَجَبَ الشُّكْرُ عَلَيْنَا * مَا دَعَا لِلَّهِ دَاعِ\nأَيُّهَا الْمَبْعُوثُ فِينَا * جِئْتَ بِالأَمْرِ الْمُطَاعِ\nأَنْتَ غَوْثُنَا جَمِيعًا * يَا مُجَمَّلَ الطِّبَاعِ\nطَلَعَ الْبَدْرُ عَلَيْنَا * مِنْ ثَنِيَّةِ الْوَدَاعِ\nوَجَبَ الشُّكْرُ عَلَيْنَا * مَا دَعَا لِلَّهِ دَاعِ", "latin": "Thala'al badru 'alaynaa * Min tsaniyyatil wadaa'\nWajabasy syukru 'alaynaa * Maa da'aa lillaahi daa'\nAyyuhal mab'uutsu fiinaa * Ji'ta bil amril muthaa'\nAnta ghautsunaa jamii'aa * Yaa mujammalath thibaa'\nThala'al badru 'alaynaa * Min tsaniyyatil wadaa'\nWajabasy syukru 'alaynaa * Maa da'aa lillaahi daa'", "translation": "Bulan purnama telah terbit menyinari kita dari celah bukit Tsaniyyatul Wada'. Wajiblah rasa syukur atas kita selagi masih ada orang yang menyeru kepada Allah. Wahai orang yang diutus di tengah-tengah kami, engkau datang membawa perintah yang ditaati. Engkaulah penolong kami seluruhnya, wahai sosok yang berakhlak budi pekerti amat indah.", "repeatCount": 1}, {"id": 10, "title": "Penutup Marhaban & Shalawat", "arabic": "مَرْحَبًا يَا نُوْرَ الْعَيْنِ مَرْحَبًا * مَرْحَبًا جَدَّ الْحُسَيْنِ مَرْحَبًا مَرْحَبًا\nمَرْحَبًا يَا نُوْرَ الْعَيْنِ مَرْحَبًا * مَرْحَبًا جَدَّ الْحُسَيْنِ مَرْحَبًا مَرْحَبًا\nصَلَّى اللهُ عَلَى مُحَمَّدْ * صَلَّى اللهُ عَلَيْهِ وَسَلَّمْ\nصَلَّى اللهُ عَلَى مُحَمَّدْ * يَارَبِّ صَلِّ وَسَلِّمْ\nيَا نَبِي سَلَامْ عَلَيْكَ * يَا رَسُوْل سَلَامْ عَلَيْكَ\nيَا حَبِيبْ سَلَامْ عَلَيْكَ * صَلَوَاتُ اللهِ عَلَيْكَ", "latin": "Marhaban yaa nuural 'ayni marhaban * Marhaban jaddal Husayni marhaban marhaban\nShollallaahu 'alaa Muhammad * Shollallaahu 'alayhi wa sallam\nShollallaahu 'alaa Muhammad * Yaa Rabbi sholli wa sallim\nYaa Nabii salaam 'alayka * Yaa Rasuul salaam 'alayka\nYaa Habiib salaam 'alayka * Sholawaatullaahi 'alayka", "translation": "Selamat datang wahai cahaya mata, selamat datang wahai kakek Sayyidina Husain. Semoga shalawat Allah terlimpah kepada Nabi Muhammad, shalawat dan salam atasnya. Wahai Nabi salam atasmu, wahai Rasul salam atasmu, wahai Kekasih salam atasmu, shalawat Allah senantiasa atasmu.", "repeatCount": 1}]}, "syair": {"meta": {"title": "Syair Kisah Sang Rasul (Rohatil)", "subtitle": "Qasidah Sejarah Kelahiran dan Kehidupan Rasulullah SAW", "introNote": "Syair merdu tentang riwayat hidup, nasab mulia, dan kenabian Baginda Rasulullah Muhammad SAW yang sering dilantunkan di majelis-majelis."}, "items": [{"id": 1, "title": "Bait Pembuka (Arab)", "arabic": "رَاحَتِ الْأَطْيَارُ تَشْدُو فِي لَيَالِي الْمَوْلِدِ ×٢\nوَطَرِيقُ النُّورِ يَبْدُو مِنْ مَعَانِي أَحْمَدِ ×٢\nفِي لَيَالِي الْمَوْلِدِ ×٢", "latin": "Raahatil athyaaru tasyduu fii layaaliil mawlidi (2x)\nWa thariiqun-nuuri yabduu min ma'aanii Ahmadi (2x)\nFii layaaliil mawlidi (2x)", "translation": "Burung-burung berkicau riang gembira di malam-malam maulid kelahiran, dan jalan cahaya tampak bersinar dari makna kemuliaan Nabi Ahmad.", "repeatCount": 2}, {"id": 2, "title": "1. Rohatil Athyaru Tasadu", "arabic": "رَاحَتِ الْأَطْيَارُ تَشْدُو فِي لَيَالِي الْمَوْلِدِ\nوَطَرِيقُ النُّورِ يَبْدُو مِنْ مَعَانِي أَحْمَدِ", "latin": "Rohatil Athyaru Tasadu * Fi Layalil Maulidi (2x)\nWa tariqun Nuriyabdu * Min Ma'ani Ahmadi (2x)\nFi Layalil Maulidi (2x)", "translation": "Burung-burung bernyanyi merdu menyambut malam kelahiran Nabi, dan pancaran cahaya petunjuk mulai bersinar terang dari kemuliaan budi pekerti Ahmad.", "repeatCount": 1}, {"id": 3, "title": "2. Silsilah Sang Rasul", "arabic": "عَبْدُ اللهِ نَامَا أَيَاهْنَا * آمِنَةُ إِبُونْدَانْيَا\nعَبْدُ الْمُطَّلِبِ كَاكِيكْنْيَا * أَبُو طَالِبٍ بَامَانْنْيَا\nخَدِيجَةُ إِسْتْرِي سَتِيَا * فَاطِمَةُ بُوتْرِي تَرْتْشِينْتَا\nسَمُوَا بَرْنَاسَبْ مُولِيَا * دَارِي قُرَيْشٍ تَرْنَامَا", "latin": "Abdullah nama ayahnya * Aminah ibundanya\nAbdul Mutholib kakeknya * Abu Tholib pamannya\nKhadijah istri setia * Fatimah putri tercinta\nSemua bernasab mulia * Dari Quraisy ternama\n\nInilah kisah sang Rosul * yang penuh suka duka (2x)\nYang penuh suka duka (2x)", "translation": "Mengenal keluarga inti dan silsilah nasab mulia Rasulullah SAW dari kabilah Quraisy yang termasyhur.", "repeatCount": 1}, {"id": 4, "title": "3. Masa Kelahiran & Kanak-kanak", "arabic": "دُوَا بُولَانْ دِيكَانْدُونْغَانْ * وَفَاةْ أَيَاهَانْدَانْيَا\nتَاهُونْ جَاجَاهْ دِيلَاهِيرْكَانْ * يَاتِيمْ دَنْغَانْ كَاكِيكْنْيَا\nسَسُوَائِي عَادَتْ يَاغْ أَدَا * دِيسُوسُوئي حَلِيمَة\nإِينَامْ تَاهُونْ أُوسِيَانْيَا * وَفَاةْ إِبُو تَرْتْشِينْتَا", "latin": "Dua bulan dikandungan * wafat Ayahandanya\nTahun Gajah dilahirkan * Yatim dengan kakeknya\nSesuai adat yang ada * Disusui Halimah\nEnam tahun usianya * wafat ibu tercinta\n\nInilah kisah sang Rosul * yang penuh suka duka (2x)\nYang penuh suka duka (2x)", "translation": "Masa kelahiran Nabi di Tahun Gajah dalam keadaan yatim, disusui oleh Halimah As-Sa'diyah, hingga wafatnya ibunda tercinta saat beliau berusia 6 tahun.", "repeatCount": 1}, {"id": 5, "title": "4. Masa Remaja Rasulullah", "arabic": "دَلَابَانْ تَاهُونْ أُوسِيَا * كَاكِيكْ مَنِينْغَّالْكَانْنْيَا\nأَبُو طَالِبٍ مَنْجَاغَا * بَامَانْ بَالِيغْ مَمْبِيلَا\nسَاعَاتْ كَتْشِيلْ مَنْغَمْبَالَا * دَاغَانْغْ سَاعَاتْ رَمَاجَا\nأُومُورْ دُوَا فُولُوهْ لِيمَا * مَمْفَرِيسْتْرِي خَدِيجَة", "latin": "Delapan tahun usia * kakek meninggalkannya\nAbu Tholib menjaga * Paman paling membela\nSaat kecil mengembala * Dagang saat remaja\nUmur dua puluh lima * Memperistri Khadijah\n\nInilah kisah sang Rosul * yang penuh suka duka (2x)\nYang penuh suka duka (2x)", "translation": "Kakek Abdul Muthalib wafat ketika beliau berusia 8 tahun, lalu diasuh oleh sang paman Abu Thalib. Beliau menggembala kambing, berdagang dengan jujur hingga diperistri oleh Sayyidah Khadijah Al-Kubra pada usia 25 tahun.", "repeatCount": 1}, {"id": 6, "title": "5. Diangkat Menjadi Rasul", "arabic": "دِي أُومُورْ كَتِيغَا فُولُوهْ * مَمْفَرَسَاتُوكَانْ بَاغْسَا\nسَاعَاتْ فَلَاتَاكَانْ بَاتُو * حَجَرْ أَسْوَدْ مُولِيَا\nغَنَابْ إِمْفَاتْ فُولُوهْ تَاهُونْ * مَنْدَافَاتْكَانْ إِشْيَارُوهْ\nإِيَا فُونْ مَنْجَادِي رَسُولْ * آخِيرْ فَاَرَا أَنْبِيَاء", "latin": "Di umur ketiga puluh * mempersatukan bangsa\nSaat peletakan batu * Hajar Aswad mulia\nGenap empat puluh tahun * Mendapatkan Isyaroh\nIa pun menjadi rosul * Akhir para Anbiya\n\nInilah kisah sang Rosul * yang penuh suka duka (2x)\nYang penuh suka duka (2x)", "translation": "Kebijaksanaan Rasulullah menyelesaikan sengketa peletakan Hajar Aswad, hingga menerima wahyu kenabian di Gua Hira pada usia 40 tahun sebagai penutup para Nabi dan Rasul (Khatamun Nabiyyin).", "repeatCount": 1}]}, "yaumil": {"meta": {"title": "Yaumil Akhir (Nadhom Sunda)", "subtitle": "Doa Pupuh Sunda Kasalametan di Yaumil Qiyamah", "introNote": "Nadhom panyuhunkeun ka Gusti Allah SWT supados dina dinten kiamat urang sadaya dikempelkeun sareng ibu rama, wargi, para guru, sareng para aulia diiring panangtayungan Gusti."}, "items": [{"id": 1, "title": "Bubuka Shalawat", "arabic": "صَلَاةُ اللهِ وَسَلَامْ * عَلَى مَنْ أُحْيِيَ الْقُرْآنْ\nوَعَلَى أَهْلِ بَيْتِهِ الْكِرَامْ * وَصَحْبِهِ ذَوِي الْقُرْآنْ", "latin": "Sholatullohi wasalam * Alaman uhiyal qur'an\nWa ahli baitihil qirom * Wasohbihi dzawil qur'an", "translation": "Rahmat kasalametan ti Gusti Allah mugia dilimpahkeun ka Nabi anu ngahirupkeun Al-Qur'an, oge ka ahli baitna anu mulya sareng para sahabatna anu ngamalkeun Al-Qur'an.", "repeatCount": 1}, {"id": 2, "title": "1. Kumpul Sareng Ibu Rama", "arabic": "فِي يَوْمِ الْآخِرِ بَامُوغِي * عَبْدِي سِينْغْ جَانْتِينْ نَغَاهِيجِي\nسَارِينْغْ إِيبُو رَامَا عَبْدِي * نْغِيرِينْغْ غُوسْتِي كَاسَامَارْغِي", "latin": "Fi Yaumil akhir pamugi * Abdi Sing janten ngahiji\nSareng ibu rama abdi * Ngiring gusti kasamargi", "translation": "Mugia jaga di dinten kiamat (Yaumil Akhir) abdi tiasa ngahiji deui sareng ibu rama abdi, nuturkeun pituduh sareng rahmat Gusti Allah nu Maha Suci.", "repeatCount": 1}, {"id": 3, "title": "2. Kumpul Sareng Dulur-dulur", "arabic": "فِي يَوْمِ الْآخِرِ بَامُوغِي * عَبْدِي سِينْغْ جَانْتِينْ نَغَاهِيجِي\nسَارِينْغْ دُولُورْ دُولُورْ عَبْدِي * نْغِيرِينْغْ غُوسْتِي كَاسَامَارْغِي", "latin": "Fi Yaumil akhir pamugi * Abdi Sing janten ngahiji\nsareng dulur-dulur abdi * Ngiring gusti kasamargi", "translation": "Mugia di dinten kiamat abdi oge tiasa kumpul ngahiji sareng sakur dulur-dulur saderek abdi dina ridho Gusti.", "repeatCount": 1}, {"id": 4, "title": "3. Kumpul Sareng Guru-guru", "arabic": "فِي يَوْمِ الْآخِرِ بَامُوغِي * عَبْدِي سِينْغْ جَانْتِينْ نَغَاهِيجِي\nسَارِينْغْ غُورُو غُورُو عَبْدِي * نْغِيرِينْغْ غُوسْتِي كَاسَامَارْغِي", "latin": "Fi Yaumil akhir pamugi * Abdi Sing janten ngahiji\nSareng guru-guru abdi * Ngiring gusti kasamargi", "translation": "Mugia di yaumil akhir abdi tiasa kumpul ngahiji sareng guru-guru pangaosan abdi anu parantos ngawurukan elmu.", "repeatCount": 1}, {"id": 5, "title": "4. Kumpul Sareng Para Wali Gusti", "arabic": "فِي يَوْمِ الْآخِرِ بَامُوغِي * عَبْدِي سِينْغْ جَانْتِينْ نَغَاهِيجِي\nسَارِينْغْ وَالِي وَالِي غُوسْتِي * نْغِيرِينْغْ غُوسْتِي كَاسَامَارْغِي", "latin": "Fi Yaumil akhir pamugi * Abdi Sing janten ngahiji\nSareng wali-wali gusti * Ngiring gusti kasamargi", "translation": "Mugia di yaumil akhir abdi kenging kabagjaan tiasa ngiring dina rombongan para aulia kakasih Gusti Allah SWT.", "repeatCount": 1}, {"id": 6, "title": "5. Doa Ziarah ka Mekah & Madinah", "arabic": "إِيِوْ سَدَايَا جَمَاعَة * مَاسِينْغْ تِيَاسَا أَنْغْكَاتْ زِيَارَة\nمُوغِي كُو غُوسْتِي دِي إِيجَابَة * كَا مَكَّة سَارِينْغْ مَدِينَة\nدِي سَارِينْغَانْ رِضَى غُوسْتِي * غُوسْتِي أَنُو مَهَا سُوتْشِي", "latin": "Ieu sadaya jamaah * Masing tiasa angkat ziarah\nmugi ku gusti di ijabah * ka mekah sareng Madinah\nDi sarengan rido gusti * gusti anu maha suci", "translation": "Mugia ieu sadaya jamaah majelis dipaparin kasehatan sareng rizki dugi ka tiasa ziarah ka baitullah Mekah sareng Madinah kalayan ridho Gusti Nu Maha Suci.", "repeatCount": 1}, {"id": 7, "title": "6. Kasalametan, Sehat & Magfiroh", "arabic": "إِيِوْ سَدَايَا جَمَاعَة * هَاسِيلْكِينْ سَدَايَا مَقْصَد\nمُوغِي كُو غُوسْتِي دِي إِيجَابَة * دِي دَامَانْغْكِينْ تِينَا فَنْيَاوَاتْ\nكُو رِضَى سَارِينْغْ مَغْفِرَة", "latin": "Ieu sadaya jamaah * Hasilkeun sadaya maksad,\nmugi ku gusti di ijabah * di damangkeun tina panyawat\nKu rido sareng magfiroh", "translation": "Mugia sadaya maksad kahadean jamaah diijabah, dicageurkeun tina sagala rupa panyakit dhohir sareng batin, dibungkus ku ridho sareng ampunan Gusti.", "repeatCount": 1}]}, "pendek": {"meta": {"title": "Surat-Surat Pendek (Juz 'Amma)", "subtitle": "Surat Pilihan & Ayat Kursi untuk Mengaji", "introNote": "Kumpulan surat-surat pendek Al-Qur'an dan ayat pilihan yang lazim dibaca saat shalat, tadarus, dan pengajian harian."}, "items": [{"id": 1, "title": "Surat Al-Fatihah (Pembuka)", "arabic": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ (١) الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ (٢) الرَّحْمَنِ الرَّحِيمِ (٣) مَالِكِ يَوْمِ الدِّينِ (٤) إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ (٥) اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ (٦) صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ (٧)", "latin": "Bismillaahir-rahmaanir-rahiim (1) Al-hamdu lillaahi Rabbil 'aalamiin (2) Ar-rahmaanir-rahiim (3) Maaliki yawmid-diin (4) Iyyaaka na'budu wa iyyaaka nasta'iin (5) Ihdinash-shiraathal mustaqiim (6) Shiraathalladziina an'amta 'alayhim ghayril maghdhuubi 'alayhim waladh-dhaalliin (7)", "translation": "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang. Segala puji bagi Allah, Tuhan seluruh alam. Yang Maha Pengasih, Maha Penyayang. Pemilik hari pembalasan. Hanya kepada Engkaulah kami menyembah dan hanya kepada Engkaulah kami mohon pertolongan. Tunjukilah kami jalan yang lurus, (yaitu) jalan orang-orang yang telah Engkau beri nikmat kepadanya; bukan (jalan) mereka yang dimurkai, dan bukan (pula jalan) mereka yang sesat."}, {"id": 2, "title": "Ayat Kursi (Al-Baqarah: 255)", "arabic": "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ", "latin": "Allaahu laa ilaaha illaa huwal hayyul qayyuum, laa ta'khudzuhuu sinatuw-wa laa nawm, lahuu maa fis-samaawaati wa maa fil-ardh, man dzalladzii yasyfa'u 'indahuu illaa bi-idznih, ya'lamu maa bayna aydiihim wa maa khalfahum, wa laa yuhiithuuna bi syay-im min 'ilmihii illaa bimaa syaa', wasi'a kursiyyuhus-samaawaati wal-ardh, wa laa ya-uuduhuu hifzhuhumaa wa huwal 'aliyyul 'azhiim.", "translation": "Allah, tidak ada Tuhan (yang berhak disembah) melainkan Dia Yang Hidup kekal lagi terus menerus mengurus (makhluk-Nya); tidak mengantuk dan tidak tidur. Kepunyaan-Nya apa yang di langit dan di bumi. Tiada yang dapat memberi syafa'at di sisi Allah tanpa izin-Nya? Allah mengetahui apa-apa yang di hadapan mereka dan di belakang mereka, dan mereka tidak mengetahui apa-apa dari ilmu Allah melainkan apa yang dikehendaki-Nya. Kursi Allah meliputi langit dan bumi. Dan Allah tidak merasa berat memelihara keduanya, dan Allah Maha Tinggi lagi Maha Besar."}, {"id": 3, "title": "Surat Al-Ikhlas (Memurnikan Keesaan Allah)", "arabic": "قُلْ هُوَ اللَّهُ أَحَدٌ (١) اللَّهُ الصَّمَدُ (٢) لَمْ يَلِدْ وَلَمْ يُولَدْ (٣) وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ (٤)", "latin": "Qul huwallaahu ahad (1) Allaahush-shamad (2) Lam yalid wa lam yuulad (3) Wa lam yakul-lahuu kufuwan ahad (4)", "translation": "Katakanlah: 'Dialah Allah, Yang Maha Esa. Allah adalah Tuhan yang bergantung kepada-Nya segala sesuatu. Dia tiada beranak dan tidak pula diperanakkan, dan tidak ada seorangpun yang setara dengan Dia.'"}, {"id": 4, "title": "Surat Al-Falaq (Waktu Subuh)", "arabic": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ (١) مِنْ شَرِّ مَا خَلَقَ (٢) وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ (٣) وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ (٤) وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ (٥)", "latin": "Qul a'uudzu bi Rabbil falaq (1) Min syarri maa khalaq (2) Wa min syarri ghaasiqin idzaa waqab (3) Wa min syarrin-naffaatsaati fil 'uqad (4) Wa min syarri haasidin idzaa hasad (5)", "translation": "Katakanlah: 'Aku berlindung kepada Tuhan Yang Menguasai subuh, dari kejahatan makhluk-Nya, dan dari kejahatan malam apabila telah gelap gulita, dan dari kejahatan wanita-wanita tukang sihir yang menghembus pada buhul-buhul, dan dari kejahatan pendengki bila ia dengki.'"}, {"id": 5, "title": "Surat An-Nas (Manusia)", "arabic": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ (١) مَلِكِ النَّاسِ (٢) إِلَهِ النَّاسِ (٣) مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ (٤) الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ (٥) مِنَ الْجِنَّةِ وَالنَّاسِ (٦)", "latin": "Qul a'uudzu bi Rabbin-naas (1) Malikin-naas (2) Ilaahin-naas (3) Min syarril waswaasil khannaas (4) Alladzii yuwaswisu fii shuduurin-naas (5) Minal jinnati wan-naas (6)", "translation": "Katakanlah: 'Aku berlindung kepada Tuhan (yang memelihara dan menguasai) manusia. Raja manusia. Sembahan manusia. Dari kejahatan (bisikan) syaitan yang biasa bersembunyi, yang membisikkan (kejahatan) ke dalam dada manusia, dari (golongan) jin dan manusia.'"}, {"id": 6, "title": "Surat Al-Kautsar (Nikmat yang Banyak)", "arabic": "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ (١) فَصَلِّ لِرَبِّكَ وَانْحَرْ (٢) إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ (٣)", "latin": "Innaa a'thaynaakal kawtsar (1) Fasholli li Rabbika wanhar (2) Inna syaani-aka huwal abtar (3)", "translation": "Sesungguhnya Kami telah memberikan kepadamu nikmat yang banyak. Maka dirikanlah shalat karena Tuhanmu; dan berkorbanlah. Sesungguhnya orang-orang yang membenci kamu dialah yang terputus."}, {"id": 7, "title": "Surat Al-Kafirun (Orang-Orang Kafir)", "arabic": "قُلْ يَا أَيُّهَا الْكَافِرُونَ (١) لَا أَعْبُدُ مَا تَعْبُدُونَ (٢) وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ (٣) وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ (٤) وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ (٥) لَكُمْ دِينُكُمْ وَلِيَ دِينِ (٦)", "latin": "Qul yaa ayyuhal kaafiruun (1) Laa a'budu maa ta'buduun (2) Wa laa antum 'aabiduuna maa a'bud (3) Wa laa ana 'aabidum maa 'abattum (4) Wa laa antum 'aabiduuna maa a'bud (5) Lakum diinukum wa liya diin (6)", "translation": "Katakanlah: 'Hai orang-orang kafir, aku tidak akan menyembah apa yang kamu sembah. Dan kamu bukan penyembah Tuhan yang aku sembah. Dan aku tidak pernah menjadi penyembah apa yang kamu sembah, dan kamu tidak pernah (pula) menjadi penyembah Tuhan yang aku sembah. Untukmu agamamu, dan untukkulah agamaku.'"}, {"id": 8, "title": "Surat An-Nasr (Pertolongan)", "arabic": "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ (١) وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا (٢) فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا (٣)", "latin": "Idzaa jaa-a nashrullaahi wal fath (1) Wa ra-aytan-naasa yadkhuluuna fii diinillaahi afwaajaa (2) Fasabbih bihamdi Rabbika wastaghfirh, innahuu kaana tawwaabaa (3)", "translation": "Apabila telah datang pertolongan Allah dan kemenangan, dan kamu lihat manusia masuk agama Allah dengan berbondong-bondong, maka bertasbihlah dengan memuji Tuhanmu dan mohonlah ampun kepada-Nya. Sesungguhnya Dia adalah Maha Penerima taubat."}, {"id": 9, "title": "Surat Al-Ma'un (Barang-Barang yang Berguna)", "arabic": "أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ (١) فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ (٢) وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ (٣) فَوَيْلٌ لِلْمُصَلِّينَ (٤) الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ (٥) الَّذِينَ هُمْ يُرَاءُونَ (٦) وَيَمْنَعُونَ الْمَاعُونَ (٧)", "latin": "Ara-aytalladzii yukadz-dzibu bid-diin (1) Fa dzaalikalladzii yadu''ul yatiim (2) Wa laa yahudh-dhu 'alaa tho'aamil miskiin (3) Fa waylul lil mushalliin (4) Alladziina hum 'an shalaatihim saahuun (5) Alladziina hum yuraa-uun (6) Wa yamna'uunal maa'uun (7)", "translation": "Tahukah kamu (orang) yang mendustakan agama? Itulah orang yang menghardik anak yatim, dan tidak menganjurkan memberi makan orang miskin. Maka celakalah bagi orang-orang yang shalat, (yaitu) orang-orang yang lalai dari shalatnya, orang-orang yang berbuat riya, dan enggan (menolong dengan) barang berguna."}, {"id": 10, "title": "Surat Quraisy (Suku Quraisy)", "arabic": "لِإِيلَافِ قُرَيْشٍ (١) إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ (٢) فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ (٣) الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ (٤)", "latin": "Li-iilaafi Quraysy (1) Iilaafihim rihlatasy-syitaa-i wash-shayf (2) Falya'buduu Rabba haadzal bayt (3) Alladzii ath'amahum min juu'iw wa aamanahum min khawf (4)", "translation": "Karena kebiasaan orang-orang Quraisy, (yaitu) kebiasaan mereka bepergian pada musim dingin dan musim panas. Maka hendaklah mereka menyembah Tuhan Pemilik rumah ini (Ka'bah). Yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari ketakutan."}, {"id": 11, "title": "Surat Al-Fil (Gajah)", "arabic": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ (١) أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ (٢) وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ (٣) تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ (٤) فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ (٥)", "latin": "Alam tara kayfa fa'ala Rabbuka bi-ash-haabil fiil (1) Alam yaj'al kaydahum fii tadhliil (2) Wa arsala 'alayhim thayran abaabiil (3) Tarmiihim bi hijaaratim min sijjiil (4) Fa ja'alahum ka'ashfim ma'kuul (5)", "translation": "Apakah kamu tidak memperhatikan bagaimana Tuhanmu telah bertindak terhadap tentara bergajah? Bukankah Dia telah menjadikan rencana jahat mereka itu sia-sia? Dan Dia mengirimkan kapada mereka burung yang berbondong-bondong, yang melempari mereka dengan batu (berasal) dari tanah yang terbakar, lalu Dia menjadikan mereka seperti daun-daun yang dimakan (ulat)."}, {"id": 12, "title": "Surat Al-'Ashr (Masa)", "arabic": "وَالْعَصْرِ (١) إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ (٢) إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ (٣)", "latin": "Wal 'ashr (1) Innal insaana lafii khusr (2) Illalladziina aamanuu wa 'amilush-shaalihaati wa tawaashaw bil haqqi wa tawaashaw bish-shabr (3)", "translation": "Demi masa. Sesungguhnya manusia itu benar-benar dalam kerugian, kecuali orang-orang yang beriman dan mengerjakan amal saleh dan nasehat menasehati supaya mentaati kebenaran dan nasehat menasehati supaya menetapi kesabaran."}]}, "bilal": {"meta": {"title": "Bacaan Bilal Tarawih & Witir", "subtitle": "Panduan Dialog Bilal & Jawaban Jamaah (20 Rakaat + 3 Witir)", "introNote": "Panduan bacaan seruan bilal dan jawaban jamaah untuk shalat tarawih berjamaah serta shalat witir, bersumber dari kitab majelis."}, "tar": [{"number": 1, "phase": "Rakaat 1 & 2 (Awal Tarawih)", "bilalCall": "صَلُّوْا سُنَّةَ التَّرَاوِيْحِ رَكْعَتَيْنِ جَامِعَةً رَحِمَكُمُ اللهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Sholluu sunnatat-taraawiihi rak'atayni jaami'atan rahimakumullaah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَحِمَكُمُ اللهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Rahimakumullaah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 2, "phase": "Rakaat 3 & 4", "bilalCall": "فَضْلًا مِنَ اللهِ تَعَالَى وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Fadhlan minallaahi ta'aalaa wa ni'mah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "وَمَغْفِرَةً وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Wa maghfiratan wa ni'mah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 3, "phase": "Rakaat 5 & 6 (Sayyidina Abu Bakar Ash-Shiddiq)", "bilalCall": "اَلْخَلِيفَةُ الْأُولَى سَيِّدُنَا أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Al-khaliifatul uulaa sayyidunaa Abuu Bakrinish-Shiddiiq radhiyallaahu 'anhu.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Radhiyallaahu 'anhu.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 4, "phase": "Rakaat 7 & 8", "bilalCall": "فَضْلًا مِنَ اللهِ تَعَالَى وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Fadhlan minallaahi ta'aalaa wa ni'mah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "وَمَغْفِرَةً وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Wa maghfiratan wa ni'mah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 5, "phase": "Rakaat 9 & 10 (Sayyidina Umar bin Khattab)", "bilalCall": "اَلْخَلِيفَةُ الثَّانِيَةُ سَيِّدُنَا عُمَرُ ابْنُ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Al-khaliifatuts tsaaniyah sayyidunaa 'Umarubnul Khath-thaabi radhiyallaahu 'anhu.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Radhiyallaahu 'anhu.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 6, "phase": "Rakaat 11 & 12", "bilalCall": "فَضْلًا مِنَ اللهِ تَعَالَى وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Fadhlan minallaahi ta'aalaa wa ni'mah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "وَمَغْفِرَةً وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Wa maghfiratan wa ni'mah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 7, "phase": "Rakaat 13 & 14 (Sayyidina Utsman bin Affan)", "bilalCall": "اَلْخَلِيفَةُ الثَّالِثَةُ سَيِّدُنَا عُثْمَانُ بْنُ عَفَّانَ رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Al-khaliifatuts tsaalitsah sayyidunaa 'Utsmaanubnu 'Affaana radhiyallaahu 'anhu.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Radhiyallaahu 'anhu.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 8, "phase": "Rakaat 15 & 16", "bilalCall": "فَضْلًا مِنَ اللهِ تَعَالَى وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Fadhlan minallaahi ta'aalaa wa ni'mah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "وَمَغْفِرَةً وَنِعْمَةً\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Wa maghfiratan wa ni'mah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 9, "phase": "Rakaat 17 & 18 (Sayyidina Ali bin Abi Thalib)", "bilalCall": "اَلْخَلِيفَةُ الرَّابِعَةُ سَيِّدُنَا عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Al-khaliifatur raabi'ah sayyidunaa 'Aliyyubnu Abii Thaalibin radhiyallaahu 'anhu.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَضِيَ اللهُ عَنْهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Radhiyallaahu 'anhu.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 10, "phase": "Rakaat 19 & 20 (Akhir Tarawih)", "bilalCall": "آخِرُ التَّرَاوِيْحِ أَجَرَكُمُ اللهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Aakhirut taraawiihi ajarakumullaah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "آمِيْنَ يَارَبَّ الْعَالَمِيْنَ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Aamiina yaa Rabbal 'aalamiin.\n\nAllaahumma sholli wa sallim 'alayh."}], "wit": [{"number": 1, "phase": "Witir Rakaat 1 & 2", "bilalCall": "صَلُّوْا سُنَّةَ الْوِتْرِ رَكْعَتَيْنِ جَامِعَةً رَحِمَكُمُ اللهُ\n\nاَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ", "bilalCallLatin": "Sholluu sunnatal witri rak'atayni jaami'atan rahimakumullaah.\n\nAllaahumma sholli 'alaa sayyidinaa Muhammad.", "jamaahResponse": "رَحِمَكُمُ اللهُ\n\nاَللَّهُمَّ صَلِّ وَسَلِّمْ عَلَيْهِ", "jamaahResponseLatin": "Rahimakumullaah.\n\nAllaahumma sholli wa sallim 'alayh."}, {"number": 2, "phase": "Witir Rakaat 3 (Terakhir)", "bilalCall": "صَلُّوْا سُنَّةَ الْوِتْرِ رَكْعَةً جَامِعَةً رَحِمَكُمُ اللهُ", "bilalCallLatin": "Sholluu sunnatal witri rak'atan jaami'atan rahimakumullaah.", "jamaahResponse": "رَحِمَكُمُ اللهُ", "jamaahResponseLatin": "Rahimakumullaah."}], "doa": {"id": 99, "title": "Doa Sesudah Shalat Witir", "arabic": "اللَّهُمَّ إِنَّا نَسْأَلُكَ رِضَاكَ وَالْجَنَّةَ وَنَعُوذُ بِكَ مِنْ سَخَطِكَ وَالنَّارِ\n\nاللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنَّا يَا أَرْحَمَ الرَّاحِمِينَ", "latin": "Allaahumma innaa nas-aluka ridhaaka wal jannata wa na'uudzu bika min sakhathika wan-naar.\nAllaahumma innaka 'afuwwun kariimun tuhibbul 'afwa fa'fu 'annaa yaa arhamar raahimiin.", "translation": "Ya Allah, sesungguhnya kami memohon kepada-Mu ridha-Mu dan surga, dan kami berlindung kepada-Mu dari murka-Mu dan siksa neraka. Ya Allah, sesungguhnya Engkau Maha Pengampun lagi Maha Pemurah, Engkau menyukai ampunan, maka ampunilah kami wahai Dzat Yang Maha Penyayang di antara para penyayang."}}, "doa": {"meta": {"title": "Adab & Doa Mengaji", "subtitle": "Tata Krama & Doa Sebelum/Sesudah Membaca Al-Qur'an"}, "items": [{"id": 1, "title": "Doa Sebelum Membaca Al-Qur'an", "arabic": "اَللَّهُمَّ افْتَحْ عَلَيَّ حِكْمَتَكَ وَانْشُرْ عَلَيَّ رَحْمَتَكَ وَذَكِّرْنِي مَا نَسِيتُ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", "latin": "Allaahummaftah 'alayya hikmataka wansyur 'alayya rahmataka wa dzakkirnii maa nasiitu yaa dzal jalaali wal ikraam.", "translation": "Ya Allah, bukakanlah hikmah-Mu untukku, bentangkanlah rahmat-Mu atasku, dan ingatkanlah daku terhadap apa yang aku lupakan, wahai Dzat Pemilik Keagungan dan Kemuliaan."}, {"id": 2, "title": "Doa Sebelum Belajar & Membaca (Robbi Zidni 'Ilma)", "arabic": "رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا، وَاجْعَلْنِي مِنَ الصَّالِحِينَ", "latin": "Robbi zidnii 'ilman warzuqnii fahmaa, waj'alnii minash-shaalihiin.", "translation": "Ya Tuhanku, tambahkanlah kepadaku ilmu pengetahuan dan berikanlah kepadaku karunia kepahaman, serta jadikanlah aku termasuk golongan orang-orang yang saleh."}, {"id": 3, "title": "Doa Khotmil Qur'an (Allahummarhamna bil Qur'an)", "arabic": "اَللَّهُمَّ ارْحَمْنَا بِالْقُرْآنِ، وَاجْعَلْهُ لَنَا إِمَامًا وَنُورًا وَهُدًى وَرَحْمَةً.\n\nاَللَّهُمَّ ذَكِّرْنَا مِنْهُ مَا نَسِينَا، وَعَلِّمْنَا مِنْهُ مَا جَهِلْنَا، وَارْزُقْنَا تِلَاوَتَهُ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ، وَاجْعَلْهُ لَنَا حُجَّةً يَا رَبَّ الْعَالَمِينَ.", "latin": "Allaahummarhamnaa bil Qur'aan, waj'alhu lanaa imaamaw-wa nuuraw-wa hudaw-wa rahmah.\nAllaahumma dzakkirnaa minhu maa nasiinaa, wa 'allimnaa minhu maa jahilnaa, warzuqnaa tilaawatahuu aanaa-al layli wa athraafan nahaar, waj'alhu lanaa hujjatan yaa Rabbal 'aalamiin.", "translation": "Ya Allah, rahmatilah kami dengan Al-Qur'an. Jadikanlah ia bagi kami sebagai panutan, cahaya, petunjuk, dan rahmat. Ya Allah, ingatkanlah kami dari Al-Qur'an apa yang kami terlupa, ajarkanlah kami darinya apa yang belum kami ketahui, dan anugerahilah kami kemampuan membacanya sepanjang malam dan di penghujung siang, serta jadikanlah ia sebagai pembela bagi kami, wahai Tuhan semesta alam."}, {"id": 4, "title": "Doa Sesudah Mengaji & Membaca Al-Qur'an", "arabic": "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", "latin": "Subhaanakallaahumma wa bihamdika, asyhadu al-laa ilaaha illaa anta, astaghfiruka wa atuubu ilayk.", "translation": "Maha Suci Engkau ya Allah, dengan memuji-Mu. Aku bersaksi bahwasanya tiada Tuhan selain Engkau. Aku memohon ampunan-Mu dan bertaubat kepada-Mu."}], "adab": ["1. Bersuci (Berwudhu): Diutamakan dalam keadaan suci dari hadats kecil maupun hadats besar saat membaca firman Allah.", "2. Berpakaian Bersih & Menutup Aurat: Mengenakan pakaian yang bersih, suci, dan sopan selayaknya menghadap hadirat Allah.", "3. Menghadap Kiblat & Duduk Khusyuk: Duduk dengan tenang, khusyuk, dan menghadap kiblat dengan memuliakan mushaf.", "4. Memulai dengan Ta'awwudz & Basmalah: Memohon perlindungan dari bisikan setan (A'uudzu billaahi minasy-syaithaanir-rajiim) sebelum membaca.", "5. Membaca secara Tartil (Perlahan & Jelas): Memperhatikan makharijul huruf, kaidah tajwid, waqaf, dan tanda baca.", "6. Mentadabburi Makna: Meresapi isi ayat, mengingat janji kurnia serta peringatan ancaman Allah dengan hati yang tunduk.", "7. Tidak Menyela dengan Obrolan yang Sia-sia: Menjaga fokus dan ketenangan selama membaca atau menyimak bacaan Al-Qur'an."]}};

 if(P.latin)h+='<p class="lat">'+esc(x.jamaahResponseLatin)+'</p>';return h+'</div></div>'}
function setPanel(){return '<div class="panel"><label>Ukuran Arab <input type="range" min="18" max="40" value="'+P.size+'" oninput="P.size=+this.value;save();theme();document.getElementById(\'szv\').textContent=P.size"> <span id="szv">'+P.size+'</span></label><label><input type="checkbox" '+(P.latin?'checked':'')+' onchange="P.latin=this.checked;save();render()"> Tampilkan Latin</label><label><input type="checkbox" '+(P.tr?'checked':'')+' onchange="P.tr=this.checked;save();render()"> Tampilkan terjemahan</label><label><input type="checkbox" '+(P.haptic?'checked':'')+' onchange="P.haptic=this.checked;save()"> Getar pada tasbih</label></div>'}
function themeBtn(){var n={system:"Sistem",light:"Terang",dark:"Gelap"};return '<button onclick="P.theme=P.theme===\'system\'?\'light\':P.theme===\'light\'?\'dark\':\'system\';save();theme();render()">Tema: '+n[P.theme]+'</button>'}
function mark(c,id){P.bm={c:c,id:String(id),t:(itemsOf(c).filter(function(x){return String(x.id)===String(id)})[0]||{}).title||""};save();render();jumpTo("i-"+c+"-"+id,true);toast("Penanda disimpan")}
function jumpTo(id,quiet){var e=document.getElementById(id);if(!e)return;if(!quiet)e.scrollIntoView({block:"start"});e.classList.add("flash");setTimeout(function(){e.classList.remove("flash")},1800)}

function render(){var a=document.getElementById("app"),h="";
 if(S.v==="home"){
  h+='<div class="top"><h1 class="grow">Panduan Mengaji</h1>'+themeBtn()+'</div><p class="sub">Majlis Al-Muntaha, Majelis Mudzakaroh Qur’an Baitussalim</p>';
  h+='<input type="search" id="q" placeholder="Cari judul atau bacaan" value="'+esc(S.q)+'" oninput="S.q=this.value;results()">';
  if(P.bm&&cat(P.bm.c))h+='<button class="last" onclick="go(\'read\',\''+P.bm.c+'\',\'i-'+P.bm.c+'-'+P.bm.id+'\')">Lanjutkan membaca: <b>'+esc(P.bm.t)+'</b></button>';
  h+='<div id="res"></div><div class="cats" id="cats">';
  CATS.forEach(function(c){var tb=c.id==="tasbih";h+='<button class="cat'+(tb?' tb':'')+'" onclick="go(\''+(tb?'tasbih':'read')+'\',\''+c.id+'\')"><span class="a">'+c.a+'</span><b>'+c.n+'</b><small>'+c.d+'</small></button>'});
  h+='</div><div class="row"><button class="pri" onclick="go(\'add\')">Tambah bacaan dari PDF</button></div>';a.innerHTML=h;results();
 }else if(S.v==="read"){var c=S.c,d=D[c],m=d.meta||{};
  h+='<div class="top"><button onclick="go(\'home\')">Kembali</button><h2 class="grow">'+esc(m.title||cat(c).n)+'</h2><button onclick="S.set=!S.set;render()">Atur</button></div>';
  if(S.set)h+=setPanel();
  if(m.subtitle)h+='<p class="sub">'+esc(m.subtitle)+'</p>';
  if(m.introNote)h+='<div class="intro">'+esc(m.introNote)+'</div>';
  if(c==="bilal"){h+='<div class="sec">Shalat Tarawih</div>';d.tar.forEach(function(x){h+=bcard(x,"t")});h+='<div class="sec">Shalat Witir</div>';d.wit.forEach(function(x){h+=bcard(x,"w")});h+=card(c,{id:"doa",title:d.doa.title,arabic:d.doa.arabic,latin:d.doa.latin,translation:d.doa.translation});}
  else{d.items.forEach(function(x){h+=card(c,x)});
   if(c==="doa"){h+='<div class="sec">Adab membaca Al-Qur’an</div>';d.adab.forEach(function(x){h+='<div class="card">'+esc(x)+'</div>'})}}
  a.innerHTML=h;if(S.jump)jumpTo(S.jump);
 }else if(S.v==="add"){a.innerHTML=addView();}else if(S.v==="tasbih"){var z=ZK[P.tz];
  h+='<div class="top"><button onclick="go(\'home\')">Kembali</button><h2 class="grow">Tasbih Digital</h2></div><div class="row">';
  ZK.forEach(function(k,i){h+='<button class="'+(P.tz===i?'on':'')+'" onclick="P.tz=+'+i+';P.tn=0;save();render()">'+k[0]+'</button>'});
  h+='</div><div class="zk" lang="ar">'+z[1]+'</div><div class="row">';
  [33,99,100,0].forEach(function(x){h+='<button class="'+(P.tt===x?'on':'')+'" onclick="P.tt='+x+';P.tn=0;save();render()">'+(x?'Target '+x:'Tanpa target')+'</button>'});
  h+='</div><div class="count" id="cnt" aria-live="polite">'+cnt()+'</div><p class="sub" id="tot" style="text-align:center">Putaran selesai: '+P.ttot+'</p><button class="tbtn" onclick="tap()">Hitung</button><div class="row"><button onclick="P.tn=0;P.ttot=0;save();render()">Reset</button></div>';
  a.innerHTML=h}}
function cnt(){return P.tn+(P.tt?'<small> / '+P.tt+'</small>':'')}
function tap(){P.tn++;var done=P.tt&&P.tn>=P.tt;try{if(P.haptic&&navigator.vibrate)navigator.vibrate(done?[80,40,80]:15)}catch(e){}
 if(done){P.tn=0;P.ttot++;toast("Target tercapai")}save();document.getElementById("cnt").innerHTML=cnt();document.getElementById("tot").textContent="Putaran selesai: "+P.ttot}
function results(){var r=document.getElementById("res"),c=document.getElementById("cats");if(!r)return;var q=S.q.trim().toLowerCase();
 if(!q){r.innerHTML="";c.style.display="";return}c.style.display="none";var out=[];
 CATS.forEach(function(ct){if(ct.id==="tasbih")return;itemsOf(ct.id).forEach(function(x){if((x.title+" "+x.latin+" "+x.translation+" "+x.arabic).toLowerCase().indexOf(q)>-1)out.push([ct,x])})});
 r.innerHTML=out.length?out.slice(0,40).map(function(p){var id=p[0].id==="bilal"?"i-bilal-"+p[1].id.charAt(0)+p[1].id.slice(1):"i-"+p[0].id+"-"+p[1].id;return '<button class="item" onclick="go(\'read\',\''+p[0].id+'\',\''+id+'\')">'+esc(p[1].title)+'<small>'+esc(p[0].n)+'</small></button>'}).join(""):'<div class="empty">Tidak ada hasil untuk “'+esc(S.q)+'”. Coba kata lain.</div>'}
var A={cat:"istighosah",title:"",ar:"",la:"",tr:"",rep:1,msg:"",bk:""};
function addMine(m){if(m&&m.item&&D[m.c]&&D[m.c].items)D[m.c].items.push(m.item)}
P.mine=P.mine||[];P.mine.forEach(addMine);
function addView(){var h='<div class="top"><button onclick="go(\'home\')">Kembali</button><h2 class="grow">Tambah bacaan dari PDF</h2></div>';
 h+='<div class="intro">PDF dibaca langsung di browser Anda dan tidak dikirim ke mana pun. Bacaan yang ditambahkan hanya tersimpan di perangkat ini, jamaah lain tidak ikut melihatnya.</div>';
 h+='<span class="fl">Kategori</span><select onchange="A.cat=this.value">';
 CATS.forEach(function(c){if(c.id!=="bilal"&&c.id!=="tasbih")h+='<option value="'+c.id+'"'+(A.cat===c.id?' selected':'')+'>'+esc(c.n)+'</option>'});
 h+='</select><span class="fl">File PDF</span><input type="file" accept="application/pdf" onchange="readPdf(this.files[0])"><p class="sub" role="status">'+esc(A.msg)+'</p>';
 h+='<span class="fl">Judul</span><input type="text" value="'+esc(A.title)+'" oninput="A.title=this.value">';
 h+='<span class="fl">Teks Arab (satu bait per baris)</span><textarea dir="rtl" lang="ar" oninput="A.ar=this.value">'+esc(A.ar)+'</textarea>';
 h+='<span class="fl">Latin</span><textarea oninput="A.la=this.value">'+esc(A.la)+'</textarea>';
 h+='<span class="fl">Terjemahan</span><textarea oninput="A.tr=this.value">'+esc(A.tr)+'</textarea>';
 h+='<span class="fl">Jumlah hitungan (kosongkan atau 1 jika tidak ada)</span><input type="number" min="1" value="'+esc(A.rep)+'" oninput="A.rep=this.value">';
 h+='<div class="row"><button class="pri" onclick="saveMine()">Simpan bacaan</button></div>';
 h+='<div class="sec">Cadangan</div><p class="sub">Salin cadangan untuk memindahkan bacaan tambahan ke perangkat lain, lalu tempel dan pulihkan di sana.</p><div class="row"><button onclick="bkCopy()">Salin cadangan</button></div><textarea placeholder="Tempel cadangan di sini" oninput="A.bk=this.value">'+esc(A.bk)+'</textarea><div class="row"><button onclick="bkRestore()">Pulihkan</button></div>';
 return h}
function isAr(s){var a=(s.match(/[\u0600-\u06FF]/g)||[]).length,l=(s.match(/[A-Za-z]/g)||[]).length;return a>l}
function readPdf(f){if(!f)return;
 if(typeof pdfjsLib==="undefined"){A.msg="Pembaca PDF gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.";render();return}
 A.msg="Membaca PDF…";render();
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 var rd=new FileReader();
 rd.onerror=function(){A.msg="File tidak bisa dibuka.";render()};
 rd.onload=function(){pdfjsLib.getDocument({data:new Uint8Array(rd.result)}).promise.then(async function(doc){
  var lines=[];
  for(var p=1;p<=doc.numPages;p++){var pg=await doc.getPage(p),tc=await pg.getTextContent(),y=null,ln="";
   tc.items.forEach(function(it){if(!it.transform)return;var yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){if(ln.trim())lines.push(ln.trim());ln=""}y=yy;ln+=it.str});
   if(ln.trim())lines.push(ln.trim())}
  if(!lines.length){A.msg="PDF ini tidak punya teks yang bisa dibaca (kemungkinan hasil scan). Kirim file-nya ke Claude di chat agar dibaca dari gambar halamannya.";render();return}
  var ar=lines.filter(isAr),la=lines.filter(function(x){return !isAr(x)});
  A.ar=ar.join("\n");A.la=la.join("\n");
  if(!A.title)A.title=f.name.replace(/\.pdf$/i,"");
  A.msg="Selesai: "+doc.numPages+" halaman, "+ar.length+" baris Arab, "+la.length+" baris lain. Periksa harakat dan urutan baris, lalu sunting sebelum disimpan.";render();
 }).catch(function(){A.msg="PDF gagal dibaca. Coba file lain, atau kirim ke Claude di chat.";render()})};
 rd.readAsArrayBuffer(f)}
function saveMine(){var t=A.title.trim(),ar=A.ar.trim();if(!t||!ar){toast("Isi judul dan teks Arab");return}
 var it={id:"u"+Date.now(),title:t,arabic:ar,latin:A.la.trim(),translation:A.tr.trim(),repeatCount:Math.max(1,parseInt(A.rep,10)||1),u:1};
 var m={c:A.cat,item:it};P.mine.push(m);addMine(m);save();var c=A.cat;
 A.title=A.ar=A.la=A.tr="";A.rep=1;A.msg="";toast("Bacaan disimpan");go("read",c,"i-"+c+"-"+it.id)}
function delMine(c,id){P.mine=P.mine.filter(function(m){return m.item.id!==id});D[c].items=D[c].items.filter(function(x){return x.id!==id});if(P.bm&&P.bm.id===id)P.bm=null;save();render();toast("Bacaan dihapus")}
function bkCopy(){try{navigator.clipboard.writeText(JSON.stringify(P.mine)).then(function(){toast("Cadangan disalin")},function(){toast("Gagal menyalin")})}catch(e){toast("Gagal menyalin")}}
function bkRestore(){try{var l=JSON.parse(A.bk),n=0;if(!Array.isArray(l))throw 0;l.forEach(function(m){if(m&&m.item&&m.item.id&&D[m.c]&&D[m.c].items&&!P.mine.some(function(q){return q.item.id===m.item.id})){m.item.u=1;P.mine.push(m);addMine(m);n++}});save();A.bk="";render();toast(n+" bacaan dipulihkan")}catch(e){toast("Cadangan tidak valid")}}
theme();render();
</script>
</body>
</html>
